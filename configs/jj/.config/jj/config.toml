#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Robin Gruyters"
email = "2082795+rgruyters@users.noreply.github.com"

[signing]
behavior = "own"
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDwvos7+grPbpsi2YpmAUtHIVdluFOQsCoCh75MqXpzo"

[aliases]
# Move the closest bookmark to the current commit. This is useful when
# working on a named branch, creating a bunch of commits, and then needing
# to update the bookmark before pushing.
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]

# Rebase the current branch onto the trunk.
retrunk = ["rebase", "-d", "trunk()"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"fork_history(to, from)" = "fork_point(to | from)..@"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[ui]
default-command = "log"
diff.format = "git"

[colors]
"diff token" = { underline = false }
"diff remove token" = { bg = "#ebbcba" }
"diff added token" = { bg = "#9ccfd8" }
