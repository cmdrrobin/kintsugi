# Terminal multiplexer
# https://github.com/tmux/tmux

# keybindings
# Unbind default leader and update to CTRL-A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h # alternative for '%'
bind - split-window -v # alternative for '"'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#
# OpenCode: pass modified Enter keys using CSI u sequences
# Shift-Enter and Ctrl-Enter for new lines
bind -n S-Enter send-keys Escape "[13;2u"
bind -n C-Enter send-keys Escape "[13;5u"

set -g base-index 1                     # start windows and panes at 1, not 0
set -g pane-base-index 1                # start pane index at 1
set-window-option -g pane-base-index 1  # start pane index at 1
set-option -g renumber-windows on       # when window closed, renumber the windows
set -g detach-on-destroy off            # don't exit from tmux when closing a session
set -g renumber-windows on              # renumber all windows when any window is closed
set -g status-interval 3                # update the status bar every 3 seconds
set -g mouse on                         # enable mouse support
set -sg escape-time 0                   # Fix escape key for vim
set -g default-terminal "tmux-256color" # set default terminal support

# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# fix ssh agent when tmux is detached
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# Toggle synchronize panes on or off
bind-key Y set-window-option synchronize-panes\; display-message "synchronize-panes #{?pane_synchronized,on,off}"

# set status and window colouring and style
# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'


# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=#b4befe,bold] #S #[bg=default] "
set -g status-right "#[fg=#b4befe,bold,bg=default]%a %d (W%W) - %I:%M %p" # time and date
# set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W#{?window_zoomed_flag,+, } "
set -g window-status-current-format "#[fg=#c4a7e7,bold] #I:#W#{?window_zoomed_flag,+, } "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#b4befe"
set -g message-style "bg=default,fg=#b4befe"
set -g message-command-style "bg=default,fg=#b4befe"
set -g mode-style "bg=#b4befe,fg=black"
setw -g clock-mode-colour "#c4a7e7"

bind-key "S" run-shell "sesh connect \"$(
  sesh list --icons --hide-duplicates | fzf-tmux -p 100%,100% --no-border \
    --ansi \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --header-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' \
    --preview 'sesh preview {}' \
)\""

bind -N "last-session (via sesh) " L run-shell "sesh last"

# Set the tmux plugin manager path
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/state/tmux/plugins/"

if "test ! -d ~/.local/state/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/state/tmux/plugins/tpm && \
      ~/.local/state/tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control' # better control of panes
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persists sessions between shutdowns/restarts
set -g @plugin 'joshmedeski/tmux-fzf-url'       # opening urls from tmux
set -g @plugin 'christoomey/vim-tmux-navigator' # tmux navigator

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.local/state/tmux/plugins/tpm/tpm'

bind R source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

