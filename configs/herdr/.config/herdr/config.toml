onboarding = false

[theme]
name = "rose-pine"
# dark_name = "rose-pine"
# light_name = "rose-pine"
# auto_switch = true

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+a"
help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+shift+r"
# Copy mode
copy_mode = "prefix+["

zoom = "prefix+z"

# tmux: christoomey/vim-tmux-navigator — move between panes with ctrl+h/j/k/l,
# no prefix needed. (tmux also had prefix h/j/k/l via bind-key select-pane.)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# tmux: bind % split-window -h  (side-by-side panes, vertical divider)
split_vertical = "prefix+%"
# tmux: bind '"' split-window -v  (stacked panes, horizontal divider)
split_horizontal = 'prefix+"'
# tmux: bind c new-window
new_tab = "prefix+c"
# tmux: bind x
close_tab = "prefix+x"

switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+alt+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
pane_borders = false
pane_gaps = false
prompt_new_tab_name = false
sidebar_collapsed_mode = "hidden"
