onboarding = false

[theme]
name = "terminal"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+a"
help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+shift+r"
# Copy mode
copy_mode = "prefix+["

zoom = "prefix+z"

# tmux: christoomey/vim-tmux-navigator — move between panes with ctrl+h/j/k/l,
# no prefix needed. (tmux also had prefix h/j/k/l via bind-key select-pane.)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# tmux: bind % split-window -h  (side-by-side panes, vertical divider)
split_vertical = "prefix+%"
# tmux: bind '"' split-window -v  (stacked panes, horizontal divider)
split_horizontal = 'prefix+"'
# tmux: bind c new-window
new_tab = "prefix+c"
# tmux: bind x
close_tab = "prefix+x"

switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+alt+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# collapse the sidebar
# sidebar_collapsed_mode = "hidden"

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$jj_bookmark", "$jj_status"]]
