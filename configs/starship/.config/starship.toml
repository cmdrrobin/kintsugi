add_newline = true
command_timeout = 200
format = "[$hostname$directory$git_branch$git_status${custom.jj}]($style)$fill$container$terraform$kubernetes$python$golang$line_break$character"
# DEFAULT: Omarchy
# format = "[$python$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold green)"

[fill]
symbol = ' '

[directory]
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[golang]
format = "[ $version](bold cyan) "

[hostname]
ssh_symbol = ""

[kubernetes]
symbol = "☸"
disabled = false
detect_extensions = ["yaml"]
format = "[$symbol$context( ($namespace))]($style) "

[lua]
disabled = true

[package]
disabled = true

[terraform]
symbol = "󱁢 "

[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true
